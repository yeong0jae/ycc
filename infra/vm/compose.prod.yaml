services:
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.2
    restart: unless-stopped
    command: ["--address=0.0.0.0", "--port=3306", "${SQL_CONNECTION_NAME}"]

  backend:
    image: ${REGISTRY}/backend:${TAG}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://cloudsql-proxy:3306/ycc?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ycc
      DB_PASSWORD: ${DB_PASSWORD}
      KOPIS_API_KEY: ${KOPIS_API_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      FRONTEND_URL: https://${SITE_ADDRESS}
      NOTICE_IMAGE_BUCKET: ${NOTICE_IMAGE_BUCKET}
      MAP_AI_ENABLED: "true"
    depends_on:
      - cloudsql-proxy

  frontend:
    image: ${REGISTRY}/frontend:${TAG}
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
      BACKEND_PUBLIC_URL: ""
      KAKAO_MAP_KEY: ${KAKAO_MAP_KEY}
    volumes:
      - next-cache:/app/.next/cache
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - frontend
      - backend

volumes:
  caddy-data:
  next-cache:
