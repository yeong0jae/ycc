services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ycc
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ycc?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: root
      KOPIS_API_KEY: ${KOPIS_API_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      FRONTEND_URL: http://localhost:3000
      NOTICE_IMAGE_DIR: /data/notice-images
    volumes:
      - notice-images:/data/notice-images
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8080
      KAKAO_MAP_KEY: ${KAKAO_MAP_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
  notice-images:
